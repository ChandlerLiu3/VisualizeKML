[package]
name = "visualize_kml"
version = "0.3.0"
edition = "2021"
build = "build.rs"

[features]
default = []
# Experimental peak/pass/valley inference from the elevation profile. It is off
# by default because the prominence heuristic has not been validated on real
# tracks yet.
terrain-candidates = []

[dependencies]
bytemuck = { version = "1.16", features = ["derive"] }
egui = "0.29"
egui-wgpu = "0.29"
glam = "0.28"
quick-xml = "0.31"
pollster = "0.3"
rfd = "0.15"
wgpu = "22"
winit = "0.29"
